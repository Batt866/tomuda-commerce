    />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    />

    <link

    <link

      rel="stylesheet"

    <title>ТОМУДА - Импорт, түгээлт</title>
    <style>
      html,
      body {
        margin: 0;
        background: #eef2f5;
        color: #182032;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .boot-screen {
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(16px, env(safe-area-inset-top, 0px)) 24px
          max(24px, env(safe-area-inset-bottom, 0px));
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(22, 137, 154, 0.08) 1px, transparent 1px)
            0 0 / 42px 42px,
          linear-gradient(0deg, rgba(22, 137, 154, 0.06) 1px, transparent 1px) 0
            0 / 42px 42px,
          #f4f7f8;
      }
      .boot-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          132deg,
          transparent 0%,
          transparent 46%,
          rgba(22, 137, 154, 0.08) 46%,
          rgba(22, 137, 154, 0.08) 64%,
          rgba(176, 122, 26, 0.08) 64%,
          rgba(176, 122, 26, 0.08) 100%
        );
        pointer-events: none;
      }
      .boot-screen__card {
        position: relative;
        z-index: 1;
        width: min(100%, 520px);
        padding: 24px;
        border-radius: 8px;
        border: 1px solid rgba(216, 222, 230, 0.9);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 48px rgba(16, 22, 35, 0.13);
        text-align: left;
      }
      @supports (backdrop-filter: blur(14px)) {
        .boot-screen__card {
          backdrop-filter: blur(14px);
        }
      }
      .boot-screen__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .boot-screen__logo {
        display: block;
        flex: 0 0 auto;
        width: 52px;
        height: 52px;
        margin: 0;
        border-radius: 8px;
        box-shadow: 0 8px 18px rgba(22, 137, 154, 0.18);
      }
      .boot-screen__brand-copy {
        min-width: 0;
      }
      .boot-screen__brand-name {
        margin: 0;
        color: #16899a;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0;
      }
      .boot-screen__brand-sub {
        margin: 2px 0 0;
        color: #687386;
        font-size: 12px;
        line-height: 1.35;
      }
      .boot-screen__copy {
        margin-top: 22px;
      }
      .boot-screen__title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 800;
        line-height: 1.25;
      }
      .boot-screen__detail {
        margin: 7px 0 0;
        font-size: 13px;
        line-height: 1.45;
        color: #687386;
      }
      .boot-screen__progress {
        height: 6px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5ecef;
      }
      .boot-screen__progress span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #16899a, #22a79d, #b07a1a);
        animation: boot-progress 1.35s ease-in-out infinite;
      }
      .boot-screen__status-row {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 14px;
        color: #4f5b6d;
        font-size: 12px;
        font-weight: 600;
      }
      .boot-screen__pulse {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #16899a;
        box-shadow: 0 0 0 0 rgba(22, 137, 154, 0.35);
        animation: boot-pulse 1.4s ease-out infinite;
      }
      .boot-screen__preview {
        display: grid;
        gap: 8px;
        margin-top: 20px;
      }
      .boot-screen__preview-row {
        height: 36px;
        border-radius: 8px;
        background: linear-gradient(90deg, #eef4f5, #dfeaed, #eef4f5);
        background-size: 220% 100%;
        animation: boot-skeleton 1.6s ease-in-out infinite;
      }
      .boot-screen__preview-row:nth-child(2) {
        width: 86%;
        animation-delay: 0.12s;
      }
      .boot-screen__preview-row:nth-child(3) {
        width: 68%;
        animation-delay: 0.24s;
      }
      .boot-screen--error .boot-screen__progress,
      .boot-screen--error .boot-screen__status-row,
      .boot-screen--error .boot-screen__preview {
        display: none;
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        55%,
        100% {
          transform: translateX(260%);
        }
      }
      @keyframes boot-pulse {
        70% {
          box-shadow: 0 0 0 10px rgba(22, 137, 154, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(22, 137, 154, 0);
        }
      }
      @keyframes boot-skeleton {
        0% {
          background-position: 120% 0;
        }
        100% {
          background-position: -120% 0;
        }
      }
      .boot-screen__retry {
        display: inline-block;
        width: 100%;
        margin-top: 18px;
        min-height: 44px;
        padding: 0 16px;
        border: none;
        border-radius: 8px;
        background: #16899a;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .boot-screen__retry.hidden {
        display: none;
      }
      @media (max-width: 480px) {
        .boot-screen {
          padding-right: 16px;
          padding-left: 16px;
        }
        .boot-screen__card {
          padding: 20px;
        }
        .boot-screen__title {
          font-size: 1.12rem;
        }
      }
    </style>
    <link
      rel="preload"
      href="{% static 'tomuda/styles.css' %}?v=20260811-qty-col-colors"
      as="style"
    />
    <link
      rel="preload"
      href="{% static 'tomuda/app.js' %}?v=20260811-qty-col-colors"
      as="script"
    />
    <script src="{% static 'tomuda/vendor/tailwindcdn.js' %}?v=20260604-picker-qty-big"></script>
    <script>
      tailwind.config = {

              "sidebar-border": "#353d4e",

              info: "#1a7a94",
            },
          },
        },
      };
    </script>
    <link

    />
    <link
      rel="stylesheet"

    />
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" aria-live="polite">
        <div class="boot-screen__card" role="status">
          <div class="boot-screen__brand">
            <img
              src="{% static 'tomuda/branding/logo-blue.png' %}"
              alt=""
              class="boot-screen__logo"
              width="52"
              height="52"
              decoding="async"
            />
            <div class="boot-screen__brand-copy">
              <p class="boot-screen__brand-name">ТОМУДА</p>
              <p class="boot-screen__brand-sub">Импорт, түгээлт</p>
            </div>
          </div>
          <div class="boot-screen__copy">
            <p id="boot-title" class="boot-screen__title">Апп нээгдэж байна</p>
            <p id="boot-detail" class="boot-screen__detail">
              Мэдээлэл татаж байна. Түр хүлээнэ үү
            </p>
          </div>
          <div class="boot-screen__progress" aria-hidden="true">
            <span></span>
          </div>
          <div class="boot-screen__status-row" aria-hidden="true">
            <span class="boot-screen__pulse"></span>
            <span>Сервертэй холбогдож байна</span>
          </div>
          <div class="boot-screen__preview" aria-hidden="true">
            <span class="boot-screen__preview-row"></span>
            <span class="boot-screen__preview-row"></span>
            <span class="boot-screen__preview-row"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="modal"></div>
    <div id="confirm-card-overlay" class="confirm-card-overlay" hidden>
      <div
        class="confirm-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirm-card-title"
      >
        <div class="confirm-card__head">
          <h3 id="confirm-card-title" class="confirm-card__title"></h3>
          <button
            type="button"
            id="confirm-card-close"
            class="confirm-card__close"
            hidden
            aria-label="Хаах"
          >
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <p id="confirm-card-message" class="confirm-card__message"></p>
        <div class="confirm-card__actions">
          <button
            type="button"
            id="confirm-card-yes"
            class="confirm-card__btn confirm-card__btn--danger"
          ></button>
          <button
            type="button"
            id="confirm-card-no"
            class="confirm-card__btn confirm-card__btn--cancel"
          >
            Үгүй
          </button>
        </div>
      </div>
    </div>
    <div id="print-root" aria-hidden="true"></div>
    <script src="{% static 'tomuda/vendor/leaflet/leaflet.js' %}?v=20260527-map-local"></script>
    <script src="{% static 'tomuda/data.js' %}?v=20260527-menu-icon"></script>
    <script>
      window.__showTomudaFatal = function (msg) {
        var el = document.getElementById("app");
        if (!el) return;
        var safe = String(msg || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
        el.innerHTML =
          '<div class="boot-screen boot-screen--error"><div class="boot-screen__card" role="status"><div class="boot-screen__brand"><img src="/static/tomuda/branding/logo-blue.png" alt="" class="boot-screen__logo" width="52" height="52" decoding="async"><div class="boot-screen__brand-copy"><p class="boot-screen__brand-name">ТОМУДА</p><p class="boot-screen__brand-sub">Импорт, түгээлт</p></div></div><div class="boot-screen__copy"><p class="boot-screen__title">Алдаа</p><p class="boot-screen__detail">' +
          safe +
          '</p></div><button type="button" class="boot-screen__retry" onclick="__tomudaHardReload()">Дахин оролдох</button></div></div>';
      };
      window.__tomudaHardReload = function () {
        var done = function () {
          var url = new URL(location.href);
          url.searchParams.set("_reload", String(Date.now()));
          location.replace(url.toString());
        };
        if (!("serviceWorker" in navigator)) {
          done();
          return;
        }
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            return Promise.all(
              regs.map(function (r) {
                return r.unregister();
              }),
            );
          })
          .catch(function () {})
          .then(function () {
            if (!("caches" in window)) return;
            return caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                }),
              );
            });
          })
          .catch(function () {})
          .then(done);
      };
      window.__loadTomudaApp = function () {
        var sources = [
          "{% static 'tomuda/app.js' %}?v=20260811-qty-col-colors",
          "{% static 'tomuda/app.js' %}?v=" + Date.now(),
          "{% static 'tomuda/app.js' %}",
        ];
        var i = 0;
        var timer = null;
        var settled = false;

        function fail() {
          if (settled) return;
          settled = true;
          if (timer) clearTimeout(timer);
          __showTomudaFatal(
            "App файл ачаалагдсангүй. Интернет шалгаад дахин ачаална уу.",
          );
        }

        function tryNext() {
          if (settled) return;
          if (i >= sources.length) {
            fail();
            return;
          }
          var s = document.createElement("script");
          var src = sources[i++];
          var done = false;
          s.src = src;
          s.async = false;
          s.onload = function () {
            if (done || settled) return;
            done = true;
            settled = true;
            if (timer) clearTimeout(timer);
          };
          s.onerror = function () {
            if (done || settled) return;
            done = true;
            tryNext();
          };
          document.body.appendChild(s);
        }

        timer = setTimeout(function () {
          if (settled) return;
          if (window.__tomudaBooted) {
            settled = true;
            return;
          }
          // Hung request — clear SW cache and hard reload once.
          if (!sessionStorage.getItem("tomuda-boot-retry")) {
            sessionStorage.setItem("tomuda-boot-retry", "1");
            __tomudaHardReload();
            return;
          }
          fail();
        }, 20000);

        tryNext();
      };
    </script>
    <script src="{% static 'tomuda/vendor/jszip.min.js' %}?v=20260604-count-xlsx"></script>
    <script src="{% static 'tomuda/permissions.js' %}?v=20260811-qty-col-colors"></script>
    <script src="{% static 'tomuda/capacitor-geolocation.js' %}?v=20260705-promo-labels"></script>
    <script>
      __loadTomudaApp();
    </script>
  </body>
