<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ТОМУДА - Борлуулалт, агуулах</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "oklch(var(--background))",
              foreground: "oklch(var(--foreground))",
              card: "oklch(var(--card))",
              primary: "oklch(var(--primary))",
              "primary-foreground": "oklch(var(--primary-foreground))",
              secondary: "oklch(var(--secondary))",
              "muted-foreground": "oklch(var(--muted-foreground))",
              border: "oklch(var(--border))",
              sidebar: "oklch(var(--sidebar))",
              "sidebar-foreground": "oklch(var(--sidebar-foreground))",
              "sidebar-primary": "oklch(var(--sidebar-primary))",
              "sidebar-primary-foreground":
                "oklch(var(--sidebar-primary-foreground))",
              "sidebar-accent": "oklch(var(--sidebar-accent))",
              "sidebar-border": "oklch(var(--sidebar-border))",
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="./vendor/leaflet/leaflet.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" aria-live="polite">
        <div class="boot-screen__card">
          <img
            src="./branding/logo-blue.png"
            alt=""
            class="boot-screen__logo"
            width="64"
            height="64"
            decoding="async"
          />
          <p id="boot-title" class="boot-screen__title" hidden></p>
          <p id="boot-detail" class="boot-screen__detail">
            Мэдээлэл татаж байна. Түр хүлээнэ үү
          </p>
          <div class="boot-screen__spinner" aria-hidden="true"></div>
          <button
            type="button"
            id="boot-retry"
            class="boot-screen__retry hidden"
            onclick="location.reload()"
          >
            Дахин оролдох
          </button>
        </div>
      </div>
    </div>
    <div id="modal"></div>
    <script
      src="./vendor/leaflet/leaflet.js"
    ></script>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
