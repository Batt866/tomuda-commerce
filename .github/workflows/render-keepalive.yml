name: Render keep-alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake tomuda-commerce on Render
        run: |
          curl -fsS --retry 6 --retry-delay 12 --retry-all-errors --max-time 90 \
            https://tomuda-commerce.onrender.com/api/health
