name: Render keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake tomuda-commerce on Render
        run: |
          curl -fsS --retry 8 --retry-delay 15 --retry-all-errors --max-time 120 \
            https://tomuda-commerce.onrender.com/api/health
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            https://tomuda-commerce.onrender.com/
