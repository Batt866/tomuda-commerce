<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ТОМУДА - Импорт, түгээлт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "oklch(var(--background))",
              foreground: "oklch(var(--foreground))",
              card: "oklch(var(--card))",
              primary: "oklch(var(--primary))",
              "primary-foreground": "oklch(var(--primary-foreground))",
              secondary: "oklch(var(--secondary))",
              "muted-foreground": "oklch(var(--muted-foreground))",
              border: "oklch(var(--border))",
              sidebar: "oklch(var(--sidebar))",
              "sidebar-foreground": "oklch(var(--sidebar-foreground))",
              "sidebar-primary": "oklch(var(--sidebar-primary))",
              "sidebar-primary-foreground":
                "oklch(var(--sidebar-primary-foreground))",
              "sidebar-accent": "oklch(var(--sidebar-accent))",
              "sidebar-border": "oklch(var(--sidebar-border))",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./styles.css?v=20260810-history-awlaga" />
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" aria-live="polite">
        <div class="boot-screen__card" role="status">
          <div class="boot-screen__brand">
            <img
              src="./branding/logo-blue.png"
              alt=""
              class="boot-screen__logo"
              width="52"
              height="52"
              decoding="async"
            />
            <div class="boot-screen__brand-copy">
              <p class="boot-screen__brand-name">ТОМУДА</p>
              <p class="boot-screen__brand-sub">Импорт, түгээлт</p>
            </div>
          </div>
          <div class="boot-screen__copy">
            <p id="boot-title" class="boot-screen__title">Апп нээгдэж байна</p>
            <p id="boot-detail" class="boot-screen__detail">
              Мэдээлэл татаж байна. Түр хүлээнэ үү
            </p>
          </div>
          <div class="boot-screen__progress" aria-hidden="true">
            <span></span>
          </div>
          <div class="boot-screen__status-row" aria-hidden="true">
            <span class="boot-screen__pulse"></span>
            <span>Сервертэй холбогдож байна</span>
          </div>
          <div class="boot-screen__preview" aria-hidden="true">
            <span class="boot-screen__preview-row"></span>
            <span class="boot-screen__preview-row"></span>
            <span class="boot-screen__preview-row"></span>
          </div>
          <button
            type="button"
            id="boot-retry"
            class="boot-screen__retry hidden"
            onclick="location.reload()"
          >
            Дахин оролдох
          </button>
        </div>
      </div>
    </div>
    <div id="modal"></div>
    <script src="./vendor/leaflet/leaflet.js"></script>
    <script src="./data.js"></script>
    <script src="./permissions.js?v=20260808-aguulah-orders"></script>
    <script src="./app.js?v=20260810-history-awlaga"></script>
  </body>
</html>
